  <text x="50%" y="42" dominant-baseline="middle" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="3.5">PARIS</text>
</svg>
